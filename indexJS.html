<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema JS</title>
</head>
<body>

    <h1>Lista de tareas</h1>

    <input type="text" id="inputTarea" placeholder="Escribi algo">
    <button id="btnAgregar">Agregar</button>

    <ul id="listaTareas"></ul>

    <script>
        // agarrar los elementos
        var input = document.getElementById("inputTarea");
        var boton = document.getElementById("btnAgregar");
        var lista = document.getElementById("listaTareas");

        // funcion para agregar
        function agregarTarea() {
            var texto = input.value;

            // si esta vacio salta alerta
            if (texto === "") {
                alert("Escribi una tarea");
                return;
            }

            // crear item y meterlo a la lista
            var nuevoItem = document.createElement("li");
            nuevoItem.textContent = texto;
            lista.appendChild(nuevoItem);

            // borrar el texto del input
            input.value = "";
        }

        // boton para ejecutar la funcion
        boton.onclick = agregarTarea;
    </script>

</body>
</html>
